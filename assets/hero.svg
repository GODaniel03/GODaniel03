<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jesús Mejía · Fullstack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0c1e4d"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.45"/>
  <rect width="1200" height="320" fill="url(#vignette)"/>

  <g opacity="0.8">
    <circle cx="120" cy="80" r="2" fill="#60a5fa">
      <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="230" r="1.6" fill="#3b82f6">
      <animate attributeName="cy" values="230;205;230" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="100" r="2" fill="#60a5fa">
      <animate attributeName="cy" values="100;130;100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="250" r="1.6" fill="#3b82f6">
      <animate attributeName="cy" values="250;220;250" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="50" r="1.4" fill="#94a3b8">
      <animate attributeName="cy" values="50;72;50" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="265" r="2" fill="#3b82f6">
      <animate attributeName="cy" values="265;240;265" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="60" r="1.4" fill="#60a5fa">
      <animate attributeName="cy" values="60;82;60" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="260" r="1.4" fill="#94a3b8">
      <animate attributeName="cy" values="260;238;260" dur="5.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M 40 40 L 24 40 L 24 60"/>
    <path d="M 1160 40 L 1176 40 L 1176 60"/>
    <path d="M 24 260 L 24 280 L 40 280"/>
    <path d="M 1176 260 L 1176 280 L 1160 280"/>
  </g>

  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="11" fill="#475569" letter-spacing="2">
    <text x="40" y="48">~/jesus.mejia</text>
    <text x="1160" y="48" text-anchor="end">v.2026.05</text>
  </g>

  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-weight="900" filter="url(#glow)">
    <text x="600" y="160" text-anchor="middle" font-size="68" fill="#f1f5f9" letter-spacing="10">
      JESÚS MEJÍA
      <animate attributeName="x" values="600;601.5;598.5;600.5;600" dur="3.4s" repeatCount="indefinite"/>
    </text>
    <text x="603" y="160" text-anchor="middle" font-size="68" fill="#06b6d4" opacity="0" letter-spacing="10">
      JESÚS MEJÍA
      <animate attributeName="opacity" values="0;0;0.55;0;0" dur="2.1s" repeatCount="indefinite"/>
    </text>
    <text x="597" y="160" text-anchor="middle" font-size="68" fill="#ec4899" opacity="0" letter-spacing="10">
      JESÚS MEJÍA
      <animate attributeName="opacity" values="0;0;0.4;0;0" dur="2.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <line x1="380" y1="190" x2="820" y2="190" stroke="url(#line)" stroke-width="1.5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </line>

  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="16">
    <text x="600" y="222" text-anchor="middle" fill="#94a3b8" letter-spacing="6">
      FULLSTACK · SYSTEMS ENG · COSTA RICA
    </text>
    <rect x="864" y="208" width="9" height="18" fill="#60a5fa">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="3">
    <text x="600" y="270" text-anchor="middle">
      <tspan fill="#22c55e">●</tspan>  SHIPPING  ·  <tspan fill="#3b82f6">●</tspan>  OPEN_TO_WORK  ·  <tspan fill="#a78bfa">●</tspan>  BUILDING_SAAS
    </text>
  </g>
</svg>
