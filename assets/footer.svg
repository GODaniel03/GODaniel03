<svg viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1e4d"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" x2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="140" fill="url(#fbg)"/>
  <rect width="1200" height="140" fill="url(#fgrid)" opacity="0.3"/>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#fline)" stroke-width="1.5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="13" fill="#64748b" letter-spacing="3">
    <text x="600" y="65" text-anchor="middle">
      <tspan fill="#94a3b8">$</tspan>  echo  "<tspan fill="#60a5fa">thanks for scrolling</tspan>"
    </text>
    <text x="600" y="95" text-anchor="middle" font-size="11" fill="#475569">
      built with care · <tspan fill="#3b82f6">●</tspan> 2026
    </text>
  </g>
  <g opacity="0.7">
    <circle cx="200" cy="80" r="1.5" fill="#3b82f6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="105" r="1.2" fill="#60a5fa"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="70" r="1.5" fill="#3b82f6"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="100" r="1.2" fill="#60a5fa"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
