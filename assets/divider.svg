<svg viewBox="0 0 1200 6" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" x2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="1200" height="2" fill="url(#d)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="3" r="3" fill="#60a5fa">
    <animate attributeName="cx" values="200;1000;200" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
